name: Chay test tu dong

on:                         # KHI NÀO CHẠY
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest  # CHẠY Ở ĐÂU (máy ảo sạch)
    steps:                  # CHẠY NHỮNG GÌ
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore
      - run: dotnet test --logger "trx" --results-directory ./ketqua
