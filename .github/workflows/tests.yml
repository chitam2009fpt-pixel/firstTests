name: Chay test tu dong

on:
  push:
    branches: [ main ]
  pull_sequest:
    branches: [ main ]

jobs:
  test:
    runs-on: unbuntu-latest # CHẠY Ở ĐÂU (máy ảo sạch)
    steps:                  # CHẠY NHỮNG GÌ
      - users: action/checkout@v4
      - users: action/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore
      - run: dotnet test --logger "trx" --results-directory ./ketqua
